plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.all4land'
version = '0.0.1-SNAPSHOT'
description = 'Trail Map backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.jsoup:jsoup:1.21.2'
    implementation 'software.amazon.awssdk:s3:2.25.66'
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'app.auth.legacy-user-header-enabled', 'true'
}

// 개발 서버 DB 대상 선택: .\gradlew.bat bootRun -Pdb=localdb | -Pdb=supabase
tasks.named('bootRun') {
    if (project.hasProperty('db')) {
        def target = project.property('db').toString()
        if (!(target in ['localdb', 'supabase'])) {
            throw new GradleException("-Pdb는 localdb 또는 supabase만 사용할 수 있습니다: ${target}")
        }
        args "--spring.profiles.active=${target}"
    }
}

// 로컬 비밀 설정은 bootRun에서는 사용할 수 있지만 JAR에는 포함하지 않는다.
tasks.withType(Jar).configureEach {
    exclude '**/application-secret.properties'
    exclude '**/application-*-secret.properties'
    exclude '**/application-secret.yml'
    exclude '**/application-secret.yaml'
    exclude '**/application-local.properties'
    exclude '**/application-local.yml'
    exclude '**/application-local.yaml'
}
