spring.application.name=trail-map
spring.config.import=optional:application-secret.properties
spring.jpa.open-in-view=false

server.servlet.context-path=/api

#DB
spring.datasource.url=jdbc:postgresql://localhost:5432/trail_map
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# Cloudflare R2
r2.account-id=your-cloudflare-account-id
r2.bucket-name=trail-map
r2.access-key-id=${R2_ACCESS_KEY_ID}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
r2.endpoint=${R2_ENDPOINT}

app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}
