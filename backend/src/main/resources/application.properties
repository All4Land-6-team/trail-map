spring.application.name=trail-map
spring.config.import=optional:application-secret.properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

server.servlet.context-path=/api

#DB
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trail_map}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Cloudflare R2
r2.bucket-name=${R2_BUCKET_NAME:trail-map}
r2.access-key-id=${R2_ACCESS_KEY_ID:not-configured}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:not-configured}
r2.endpoint=${R2_ENDPOINT:http://localhost}
r2.upload-url-expiration=${R2_UPLOAD_URL_EXPIRATION:PT10M}
r2.read-url-expiration=${R2_READ_URL_EXPIRATION:PT1H}


app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175}

# Terrain-RGB tiles
terrain.root-path=${TERRAIN_ROOT_PATH:../data/processed/dem/bukhansan/terrain}
terrain.cache-max-age=${TERRAIN_CACHE_MAX_AGE:PT0S}
terrain.tiles-url=${TERRAIN_TILES_URL:http://localhost:8080/api/v1/terrain/{z}/{x}/{y}.png}

# Course analysis documents: shared DB by default; file mode is for existing local artifacts.
course-analysis.storage=${COURSE_ANALYSIS_STORAGE:database}
course-analysis.root-path=${COURSE_ANALYSIS_ROOT_PATH:../data/processed/course-analysis-store}
