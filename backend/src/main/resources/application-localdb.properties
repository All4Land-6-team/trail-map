# 로컬 PostgreSQL/PostGIS에 연결한다. 실행: .\gradlew.bat bootRun -Pdb=localdb
# 값을 바꿀 때는 Git에서 제외된 application-localdb-secret.properties에 적는다.
spring.config.import=optional:application-localdb-secret.properties
app.datasource.target=localdb

spring.datasource.url=jdbc:postgresql://localhost:5432/trail_map
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
